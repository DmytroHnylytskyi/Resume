services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: terrascope-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=terrascope-production-jwt-secret-key-2026
      - ENV_MODE=development
      - DATABASE_URL=sqlite+aiosqlite:///./sql_app.db
      - NASA_API_KEY=DEMO_KEY
    volumes:
      - backend-data:/app/sql_app.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: terrascope-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
