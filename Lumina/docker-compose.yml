version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: lumina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumina_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumina_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-lumina_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumina_user} -d ${POSTGRES_DB:-lumina_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumina-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumina_user}:${POSTGRES_PASSWORD:-lumina_secret_password}@db:5432/${POSTGRES_DB:-lumina_db}
      SECRET_KEY: ${SECRET_KEY:-super-secure-production-jwt-secret-key-32chars}
      FRONTEND_URL: http://localhost:3000,http://localhost:5173,http://localhost:80
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads

  # ----------------------------------------------------------------------------
  # React Vite Frontend Service (Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lumina-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
